<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>PocketCam｜即時監看</title>
<style>
:root{color-scheme:dark;--bg:#0b0e16;--panel:#151a27;--line:#293247;--muted:#9aa6bd;--accent:#6d8cff;--good:#39c98a;--bad:#ff647c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2340 0,#0b0e16 55%);color:#eef2ff;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:28px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7b8fff,#4c5bd4);display:grid;place-items:center;font-size:23px}.muted{color:var(--muted)}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 14px}.status{border:1px solid var(--line);padding:8px 12px;border-radius:99px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:16px}.card{background:linear-gradient(145deg,#171d2b,#111622);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 50px #0003}.screen{background:#05070c;border:1px solid #30394c;border-radius:14px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;position:relative}.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070c}.placeholder{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;text-align:center;color:var(--muted);padding:20px;pointer-events:none}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button.secondary{background:#252e42}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;background:#0c111c;color:white;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;outline:none}input:focus{border-color:var(--accent)}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:14px}.stats{display:grid;gap:10px}.stat{padding:12px;border-radius:12px;background:#0e1420;border:1px solid #222d40}.stat small{display:block;color:var(--muted);margin-bottom:4px}.stat strong{font-size:14px}.error{color:#ff9ba9;min-height:20px;font-size:13px;margin-top:10px}
@media(max-width:760px){main{padding:20px 12px}.layout{grid-template-columns:1fr}.top{align-items:flex-start}.fields{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body><main>
<header class="top"><div class="brand"><div class="logo">◉</div><div><h1>PocketCam</h1><div class="muted">即時監看控制台</div></div></div><div class="status" id="status">尚未連線</div></header>
<div class="layout">
<section class="card"><h2>即時畫面</h2><div class="screen"><video id="video" autoplay playsinline controls></video><div class="placeholder" id="placeholder"><div style="font-size:34px">▣</div><b>等待攝影機連線</b><div class="muted">輸入單一密碼即可連線</div></div></div><div class="controls"><button id="connect">連線觀看</button><button class="secondary" id="disconnect" disabled>中斷連線</button><button class="secondary" id="fullscreen">全螢幕</button></div><div class="error" id="error" role="status"></div></section>
<aside class="card"><h2>設備配對</h2><label for="password">單一連線密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="輸入 PocketCam 密碼"><div class="note">攝影機端與觀看端使用相同密碼。請勿把密碼分享給未授權的人。</div><div style="height:18px"></div><h2>連線資訊</h2><div class="stats"><div class="stat"><small>連線方式</small><strong id="transport">WebRTC 點對點</strong></div><div class="stat"><small>影像狀態</small><strong id="media">尚無影像</strong></div><div class="stat"><small>音訊</small><strong id="audio">等待串流</strong></div></div></aside>
</div><p class="note">PocketCam 會在攝影機端顯示持續運作通知。若跨網路無法建立點對點連線，需設定 TURN 中繼服務。</p>
</main>
<script>
const $ = id => document.getElementById(id);
const WORKER_WS = "wss://icon.chenneww6666.workers.dev/ws";
let ws = null;
let pc = null;
let heartbeat = null;
let statsTimer = null;
let remoteStream = null;
let remoteDescriptionReady = false;
let pendingCandidates = [];
let authenticated = false;
let receivedVideoTrack = false;
let receivedAudioTrack = false;

const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

function setStatus(value) {
  $("status").textContent = value;
}
function fail(value) {
  $("error").textContent = value || "";
}
function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}
function stopHeartbeat() {
  if (heartbeat !== null) {
    clearInterval(heartbeat);
    heartbeat = null;
  }
}
function stopStatsMonitor() {
  if (statsTimer !== null) {
    clearInterval(statsTimer);
    statsTimer = null;
  }
}
function cleanup(updateStatus = true) {
  stopHeartbeat();
  stopStatsMonitor();
  authenticated = false;
  remoteDescriptionReady = false;
  pendingCandidates = [];
  receivedVideoTrack = false;
  receivedAudioTrack = false;
  remoteStream = null;
  if (pc) {
    pc.ontrack = null;
    pc.onicecandidate = null;
    pc.onconnectionstatechange = null;
    pc.close();
    pc = null;
  }
  if (ws) {
    const old = ws;
    ws = null;
    old.onclose = null;
    old.close();
  }
  $("video").srcObject = null;
  $("placeholder").style.display = "grid";
  $("placeholder").innerHTML = "<div style='font-size:34px'>▣</div><b>等待攝影機連線</b><div class='muted'>輸入單一密碼即可連線</div>";
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  $("media").textContent = "尚無影像";
  $("audio").textContent = "等待串流";
  if (updateStatus) setStatus("尚未連線");
}
function attachRemoteTrack(event) {
  const track = event.track;
  if (!track) return;

  // Some WebRTC implementations provide an empty event.streams array.
  // Build a local MediaStream from every received track instead of ignoring it.
  if (!remoteStream) remoteStream = new MediaStream();
  if (!remoteStream.getTracks().some(existing => existing.id === track.id)) {
    remoteStream.addTrack(track);
  }

  if (track.kind === "video") {
    receivedVideoTrack = true;
    $("media").textContent = "已收到影像軌道，等待畫面解碼…";
    $("placeholder").innerHTML = "<div style='font-size:34px'>▣</div><b>已連接攝影機</b><div class='muted'>正在等待第一張影像</div>";
    track.onunmute = () => {
      $("media").textContent = "影像軌道已啟用，正在解碼…";
      $("video").play().catch(error => console.warn("Video playback not started", error));
    };
  } else if (track.kind === "audio") {
    receivedAudioTrack = true;
    $("audio").textContent = "已收到音訊軌道";
    if (!receivedVideoTrack) {
      $("placeholder").innerHTML = "<div style='font-size:34px'>◖</div><b>聲音已連線</b><div class='muted'>正在等待影像資料…</div>";
    }
  }

  $("video").srcObject = remoteStream;
  $("video").play().catch(error => console.warn("Remote media playback not started", error));
}
function startStatsMonitor() {
  stopStatsMonitor();
  statsTimer = setInterval(async () => {
    const current = pc;
    if (!current) return;
    try {
      const reports = await current.getStats();
      let inboundVideo = null;
      let inboundAudio = null;
      reports.forEach(report => {
        if (report.type !== "inbound-rtp") return;
        const kind = report.kind || report.mediaType;
        if (kind === "video") inboundVideo = report;
        if (kind === "audio") inboundAudio = report;
      });

      if (inboundAudio && (inboundAudio.bytesReceived || 0) > 0) {
        $("audio").textContent = "音訊接收中";
      } else if (receivedAudioTrack) {
        $("audio").textContent = "已收到音訊軌道，等待封包…";
      }

      if (inboundVideo) {
        const frames = inboundVideo.framesDecoded || 0;
        const packets = inboundVideo.packetsReceived || 0;
        if (frames > 0) {
          $("media").textContent = "影像解碼中：" + frames + " 幀";
        } else if (packets > 0) {
          $("media").textContent = "收到影像封包，尚未解碼";
        } else if (receivedVideoTrack) {
          $("media").textContent = "有影像軌道，但尚未收到封包";
        } else {
          $("media").textContent = "尚未收到影像軌道";
        }
      } else if (!receivedVideoTrack) {
        $("media").textContent = "尚未收到影像軌道";
      }
    } catch (error) {
      console.warn("Could not read WebRTC statistics", error);
    }
  }, 2000);
}
async function connect() {
  fail("");
  const password = $("password").value.trim();
  if (!password) {
    fail("請先輸入單一連線密碼");
    $("password").focus();
    return;
  }

  cleanup(false);
  $("connect").disabled = true;
  setStatus("正在連接訊號伺服器…");

  try {
    pc = new RTCPeerConnection({ iceServers });

    pc.onicecandidate = event => {
      if (event.candidate) {
        send({ type: "candidate", candidate: event.candidate });
      }
    };

    pc.ontrack = event => {
      console.info("PocketCam remote track:", event.track?.kind, "streams:", event.streams?.length || 0);
      attachRemoteTrack(event);
    };

    $("video").onloadeddata = () => {
      if ($("video").videoWidth > 0) {
        $("placeholder").style.display = "none";
        $("media").textContent = "畫面已載入：" + $("video").videoWidth + "×" + $("video").videoHeight;
      }
    };
    $("video").onplaying = () => {
      $("placeholder").style.display = "none";
      $("media").textContent = "正在播放：" + $("video").videoWidth + "×" + $("video").videoHeight;
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      setStatus("影音連線：" + pc.connectionState);
      if (pc.connectionState === "failed") {
        fail("影音連線失敗。若兩台裝置不在同一網路，可能需要 TURN 中繼服務。");
      }
      if (pc.connectionState === "disconnected") {
        fail("影音連線中斷，正在等待恢復…");
      }
    };
    startStatsMonitor();

    ws = new WebSocket(WORKER_WS);

    ws.onopen = () => {
      send({ type: "hello", role: "viewer", password });
      stopHeartbeat();
      heartbeat = setInterval(() => send({ type: "ping" }), 15000);
      setStatus("已連上訊號伺服器，正在驗證密碼…");
    };

    ws.onmessage = async event => {
      try {
        const message = JSON.parse(event.data);

        if (message.type === "authenticated") {
          authenticated = true;
          $("disconnect").disabled = false;
          setStatus("密碼驗證成功，等待攝影機…");
          return;
        }
        if (message.type === "pong") return;
        if (message.type === "peer-ready") {
          setStatus("攝影機已連線，等待影音資料…");
          return;
        }
        if (message.type === "error") {
          fail(message.message || "連線驗證失敗");
          cleanup();
          return;
        }
        if (message.type === "offer") {
          if (!pc) return;
          await pc.setRemoteDescription(message.sdp);
          remoteDescriptionReady = true;

          for (const candidate of pendingCandidates) {
            try { await pc.addIceCandidate(candidate); }
            catch (error) { console.warn("ICE candidate rejected", error); }
          }
          pendingCandidates = [];

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          send({ type: "answer", sdp: pc.localDescription });
          setStatus("已回覆攝影機，正在建立影音連線…");
          return;
        }
        if (message.type === "candidate" && message.candidate) {
          if (!pc) return;
          if (remoteDescriptionReady) {
            try { await pc.addIceCandidate(message.candidate); }
            catch (error) { console.warn("ICE candidate rejected", error); }
          } else {
            pendingCandidates.push(message.candidate);
          }
          return;
        }
        if (message.type === "peer-left") {
          setStatus("攝影機已離線");
          $("media").textContent = "攝影機離線";
          return;
        }
        if (message.type === "hangup") {
          cleanup();
          setStatus("攝影機已結束直播");
        }
      } catch (error) {
        console.error("PocketCam signaling error", error);
        fail("處理連線訊號失敗：" + (error.message || error));
      }
    };

    ws.onerror = () => {
      fail("無法連接訊號伺服器，請稍後再試。");
    };

    ws.onclose = () => {
      stopHeartbeat();
      if (ws) {
        ws = null;
        if (authenticated) setStatus("訊號連線已關閉");
        authenticated = false;
        $("connect").disabled = false;
        $("disconnect").disabled = true;
      }
    };
  } catch (error) {
    console.error("PocketCam connect error", error);
    fail("連線失敗：" + (error.message || error));
    cleanup();
  }
}

$("connect").addEventListener("click", connect);
$("disconnect").addEventListener("click", () => cleanup());
$("fullscreen").addEventListener("click", () => {
  const video = $("video");
  if (video.requestFullscreen) video.requestFullscreen();
});
window.addEventListener("beforeunload", () => cleanup(false));
</script></body></html>
