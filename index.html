<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>PocketCam｜即時監看</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#141b2b;--panel2:#101727;--line:#293650;--muted:#93a2bf;--accent:#7892ff;--good:#43d6a0;--bad:#ff7088;--text:#edf2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#273761 0,#111a2d 34%,#090d18 72%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:1220px;margin:auto;padding:30px 22px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#91a5ff,#5268dc);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 30px #5268dc55}.brand h1{font-size:24px;letter-spacing:.02em;margin:0}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.2em;color:#8da4ff;font-weight:750}.status{border:1px solid var(--line);padding:8px 13px;border-radius:99px;color:#c1cbea;font-size:12px;background:#10192a}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(285px,.8fr);gap:18px;align-items:start}.card{background:linear-gradient(145deg,#182238eF,#101827f5);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px #0004}.card h2{font-size:16px;margin:0 0 15px;letter-spacing:.02em}.screen{background:#03060c;border:1px solid #303d59;border-radius:17px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;position:relative}.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#03060c}.placeholder{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;text-align:center;color:var(--muted);padding:20px;pointer-events:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(135deg,#8198ff,#596fe8);color:white;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button.secondary{background:#293650;color:#dce5ff}button:disabled{opacity:.45;cursor:not-allowed;transform:none}input{width:100%;background:#0a1120;color:white;border:1px solid #30405e;border-radius:12px;padding:13px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7892ff22}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 7px}.note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:13px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:13px;border-radius:14px;background:#0b1322;border:1px solid #24334d;min-width:0}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.stat strong{font-size:15px;display:block;overflow-wrap:anywhere}.stat.wide{grid-column:1/-1}.section-gap{height:20px}.error{color:#ff9ba9;min-height:20px;font-size:13px;margin-top:10px}.viewer-pill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-radius:13px;background:#0b1322;border:1px solid #24334d}.viewer-pill strong{font-size:17px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:7px;box-shadow:0 0 12px #43d6a0aa}
@media(max-width:820px){main{padding:20px 13px 36px}.layout{grid-template-columns:1fr}.top{align-items:flex-start}.card{padding:16px}.brand h1{font-size:21px}}
@media(max-width:430px){.top{gap:8px}.status{font-size:11px;padding:7px 9px}.controls button{flex:1}.stats{gap:8px}.stat{padding:11px}}
</style>
</head>
<body><main>
<header class="top"><div class="brand"><div class="logo">◉</div><div><div class="eyebrow">LIVE CAMERA SYSTEM</div><h1>PocketCam</h1><div class="muted">即時監看控制台</div></div></div><div class="status" id="status">尚未連線</div></header>
<div class="layout">
<section class="card">
  <h2>即時畫面 <span class="muted" style="font-size:12px;font-weight:400">/ LIVE FEED</span></h2>
  <div class="screen"><video id="video" autoplay playsinline controls></video><div class="placeholder" id="placeholder"><div style="font-size:38px">◉</div><b>等待攝影機連線</b><div class="muted">輸入觀看密碼即可連線</div></div></div>
  <div class="controls"><button id="connect">連線觀看</button><button class="secondary" id="disconnect" disabled>中斷連線</button><button class="secondary" id="fullscreen">全螢幕</button></div>
  <div class="error" id="error" role="status"></div>
  <div class="section-gap"></div>
  <h2>即時串流數據</h2>
  <div class="stats">
    <div class="stat"><small>影像 FPS</small><strong id="fps">--</strong></div>
    <div class="stat"><small>解析度</small><strong id="resolution">--</strong></div>
    <div class="stat"><small>接收位元率</small><strong id="bitrate">--</strong></div>
    <div class="stat"><small>往返延遲 RTT</small><strong id="rtt">--</strong></div>
  </div>
</section>
<aside class="card">
  <h2>設備配對</h2>
  <label for="password">觀看密碼</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="輸入 PocketCam 密碼">
  <div class="note">攝影機手機按下開始直播即可上線。每位網頁觀看者都必須輸入觀看密碼。</div>
  <div class="section-gap"></div>
  <h2>觀看者管理</h2>
  <div class="viewer-pill"><span><span class="dot"></span>目前觀看者</span><strong id="viewerCount">0 / 4</strong></div>
  <div class="section-gap"></div>
  <h2>連線狀態</h2>
  <div class="stats">
    <div class="stat wide"><small>連線方式</small><strong id="transport">WebRTC 點對點</strong></div>
    <div class="stat wide"><small>影像狀態</small><strong id="media">尚無影像</strong></div>
    <div class="stat wide"><small>音訊</small><strong id="audio">等待串流</strong></div>
  </div>
  <p class="note">最多同時 4 位觀看者。PocketCam 會在攝影機端顯示持續運作通知。若跨網路無法建立點對點連線，可能需要 TURN 中繼服務。</p>
</aside>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const WORKER_WS = "wss://icon.chenneww6666.workers.dev/ws";
const MAX_VIEWERS = 4;
let ws = null;
let pc = null;
let heartbeat = null;
let statsTimer = null;
let remoteStream = null;
let remoteDescriptionReady = false;
let pendingCandidates = [];
let authenticated = false;
let receivedVideoTrack = false;
let receivedAudioTrack = false;
let previousVideoStats = null;
let previousStatsAt = 0;
let cameraId = null;
let clientId = null;

const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
const SIGNAL_TIMEOUT_MS = 12000;
const CAMERA_WAIT_TIMEOUT_MS = 35000;
const MEDIA_WAIT_TIMEOUT_MS = 45000;
const HEARTBEAT_INTERVAL_MS = 12000;
const HEARTBEAT_TIMEOUT_MS = 30000;
let watchdog = null;
let lastPongAt = 0;
let connectionStartedAt = 0;
let cameraSeenAt = 0;
let mediaSeenAt = 0;
let disconnectGrace = null;

function setStatus(value) {
  $("status").textContent = value;
}
function fail(value) {
  $("error").textContent = value || "";
}
function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}
function sendToCamera(data) {
  if (!cameraId) {
    console.warn("PocketCam: camera ID is not known yet; signal was not sent");
    return;
  }
  send({ ...data, target: cameraId });
}
function stopHeartbeat() {
  if (heartbeat !== null) {
    clearInterval(heartbeat);
    heartbeat = null;
  }
  if (watchdog !== null) {
    clearInterval(watchdog);
    watchdog = null;
  }
}
function clearDisconnectGrace() {
  if (disconnectGrace !== null) {
    clearTimeout(disconnectGrace);
    disconnectGrace = null;
  }
}
function startConnectionWatchdog() {
  stopHeartbeat();
  lastPongAt = Date.now();
  heartbeat = setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    send({ type: "ping" });
  }, HEARTBEAT_INTERVAL_MS);
  watchdog = setInterval(() => {
    const now = Date.now();
    if (ws && ws.readyState === WebSocket.OPEN && now - lastPongAt > HEARTBEAT_TIMEOUT_MS) {
      fail("訊號伺服器長時間沒有回應，請重新連線。");
      cleanup();
      return;
    }
    if (!cameraSeenAt && connectionStartedAt && now - connectionStartedAt > CAMERA_WAIT_TIMEOUT_MS) {
      fail("等待攝影機逾時，請確認攝影機手機仍在直播，再重新連線。");
      cleanup();
      return;
    }
    if (cameraSeenAt && !mediaSeenAt && now - cameraSeenAt > MEDIA_WAIT_TIMEOUT_MS) {
      fail("已找到攝影機，但等待影像逾時。請確認攝影機畫面正常，再重新連線。");
      cleanup();
    }
  }, 2000);
}
function stopStatsMonitor() {
  if (statsTimer !== null) {
    clearInterval(statsTimer);
    statsTimer = null;
  }
}
function cleanup(updateStatus = true) {
  stopHeartbeat();
  stopStatsMonitor();
  authenticated = false;
  remoteDescriptionReady = false;
  pendingCandidates = [];
  receivedVideoTrack = false;
  receivedAudioTrack = false;
  remoteStream = null;
  previousVideoStats = null;
  previousStatsAt = 0;
  connectionStartedAt = 0;
  cameraSeenAt = 0;
  mediaSeenAt = 0;
  clearDisconnectGrace();
  cameraId = null;
  clientId = null;
  if (pc) {
    pc.ontrack = null;
    pc.onicecandidate = null;
    pc.onconnectionstatechange = null;
    pc.close();
    pc = null;
  }
  if (ws) {
    const old = ws;
    ws = null;
    old.onclose = null;
    old.close();
  }
  $("video").srcObject = null;
  $("placeholder").style.display = "grid";
  $("placeholder").innerHTML = "<div style='font-size:34px'>▣</div><b>等待攝影機連線</b><div class='muted'>輸入觀看密碼即可連線</div>";
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  $("media").textContent = "尚無影像";
  $("audio").textContent = "等待串流";
  $("fps").textContent = "--";
  $("resolution").textContent = "--";
  $("bitrate").textContent = "--";
  $("rtt").textContent = "--";
  $("viewerCount").textContent = "0 / 4";
  $("transport").textContent = "WebRTC 點對點";
  if (updateStatus) setStatus("尚未連線");
}
function attachRemoteTrack(event) {
  const track = event.track;
  if (!track) return;

  // Build our own stream because event.streams can be empty on some WebRTC stacks.
  if (!remoteStream) remoteStream = new MediaStream();
  if (!remoteStream.getTracks().some(existing => existing.id === track.id)) {
    remoteStream.addTrack(track);
  }

  if (track.kind === "video") {
    receivedVideoTrack = true;
    mediaSeenAt = Date.now();
    $("media").textContent = "已收到影像軌道，等待畫面解碼…";
    $("placeholder").innerHTML = "<div style='font-size:34px'>▣</div><b>已連接攝影機</b><div class='muted'>正在等待第一張影像</div>";
    track.onunmute = () => {
      $("media").textContent = "影像軌道已啟用，正在解碼…";
      $("video").play().catch(error => console.warn("Video playback not started", error));
    };
    track.onmute = () => {
      $("media").textContent = "影像軌道暫停";
    };
  } else if (track.kind === "audio") {
    receivedAudioTrack = true;
    $("audio").textContent = "已收到音訊軌道";
    if (!receivedVideoTrack) {
      $("placeholder").innerHTML = "<div style='font-size:34px'>◖</div><b>聲音已連線</b><div class='muted'>正在等待影像資料…</div>";
    }
  }

  $("video").srcObject = remoteStream;
  $("video").play().catch(error => console.warn("Remote media playback not started", error));
}
function startStatsMonitor() {
  stopStatsMonitor();
  statsTimer = setInterval(async () => {
    const current = pc;
    if (!current) return;
    try {
      const reports = await current.getStats();
      const now = performance.now();
      let inboundVideo = null;
      let inboundAudio = null;
      let selectedPair = null;
      const candidates = new Map();
      reports.forEach(report => {
        if (report.type === "local-candidate" || report.type === "remote-candidate") candidates.set(report.id, report);
        if (report.type === "inbound-rtp") {
          const kind = report.kind || report.mediaType;
          if (kind === "video") inboundVideo = report;
          if (kind === "audio") inboundAudio = report;
        }
        if (report.type === "candidate-pair" && report.state === "succeeded" &&
            (report.selected || report.nominated)) selectedPair = report;
      });

      if (inboundAudio && (inboundAudio.bytesReceived || 0) > 0) {
        $("audio").textContent = "音訊接收中";
      } else if (receivedAudioTrack) {
        $("audio").textContent = "已收到音訊軌道，等待封包…";
      }

      if (inboundVideo) {
        const frames = inboundVideo.framesDecoded || 0;
        const bytes = inboundVideo.bytesReceived || 0;
        const packets = inboundVideo.packetsReceived || 0;
        const width = inboundVideo.frameWidth || 0;
        const height = inboundVideo.frameHeight || 0;
        $("resolution").textContent = width && height ? width + " × " + height : "--";
        if (frames > 0) {
          $("media").textContent = "影像解碼中：" + frames + " 幀";
        } else if (packets > 0) {
          $("media").textContent = "收到影像封包，尚未解碼";
        } else if (receivedVideoTrack) {
          $("media").textContent = "有影像軌道，但尚未收到封包";
        } else {
          $("media").textContent = "尚未收到影像軌道";
        }
        if (previousVideoStats && previousStatsAt) {
          const elapsed = (now - previousStatsAt) / 1000;
          const fps = Math.max(0, (frames - previousVideoStats.frames) / elapsed);
          const kbps = Math.max(0, (bytes - previousVideoStats.bytes) * 8 / elapsed / 1000);
          $("fps").textContent = fps.toFixed(1);
          $("bitrate").textContent = kbps.toFixed(0) + " kbps";
        }
        previousVideoStats = { frames, bytes };
        previousStatsAt = now;
      } else if (!receivedVideoTrack) {
        $("media").textContent = "尚未收到影像軌道";
      }
      if (selectedPair && Number.isFinite(selectedPair.currentRoundTripTime)) {
        $("rtt").textContent = Math.round(selectedPair.currentRoundTripTime * 1000) + " ms";
      }
      if (selectedPair) {
        const localCandidate = candidates.get(selectedPair.localCandidateId);
        const remoteCandidate = candidates.get(selectedPair.remoteCandidateId);
        const relayed = localCandidate?.candidateType === "relay" || remoteCandidate?.candidateType === "relay";
        $("transport").textContent = relayed ? "TURN 中繼連線" : "WebRTC 點對點";
      }
    } catch (error) {
      console.warn("Could not read WebRTC statistics", error);
    }
  }, 1000);
}
async function connect() {
  fail("");
  const password = $("password").value.trim();
  if (!password) {
    fail("請先輸入觀看密碼");
    $("password").focus();
    return;
  }

  cleanup(false);
  $("connect").disabled = true;
  setStatus("正在連接訊號伺服器…");

  try {
    connectionStartedAt = Date.now();
    clientId = crypto.randomUUID().replace(/-/g, "");
    pc = new RTCPeerConnection({ iceServers });

    pc.onicecandidate = event => {
      if (event.candidate) {
        sendToCamera({ type: "candidate", candidate: event.candidate });
      }
    };

    pc.ontrack = event => {
      console.info("PocketCam remote track:", event.track?.kind, "streams:", event.streams?.length || 0);
      attachRemoteTrack(event);
    };

    $("video").onloadeddata = () => {
      if ($("video").videoWidth > 0) {
        $("placeholder").style.display = "none";
        $("media").textContent = "畫面已載入：" + $("video").videoWidth + "×" + $("video").videoHeight;
      }
    };
    $("video").onplaying = () => {
      $("placeholder").style.display = "none";
      $("media").textContent = "正在播放：" + $("video").videoWidth + "×" + $("video").videoHeight;
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      const state = pc.connectionState;
      setStatus("影音連線：" + state);
      $("transport").textContent = "WebRTC · " + state;
      if (state === "connected") {
        clearDisconnectGrace();
        fail("");
      } else if (state === "disconnected") {
        fail("影音連線暫時中斷，正在嘗試自動恢復…");
        clearDisconnectGrace();
        disconnectGrace = setTimeout(() => {
          if (pc && pc.connectionState === "disconnected") {
            fail("連線未能自行恢復，請重新連線。");
            cleanup();
          }
        }, 10000);
      } else if (state === "failed") {
        clearDisconnectGrace();
        fail("影音連線建立失敗。請確認攝影機與觀看端網路正常，再重新連線。");
        cleanup();
      }
    };
    startStatsMonitor();

    ws = new WebSocket(WORKER_WS);
    const connectingSocket = ws;
    const signalTimeout = setTimeout(() => {
      if (ws === connectingSocket && connectingSocket.readyState !== WebSocket.OPEN) {
        fail("連接訊號伺服器逾時，請檢查網路後重試。");
        cleanup();
      }
    }, SIGNAL_TIMEOUT_MS);

    ws.onopen = () => {
      clearTimeout(signalTimeout);
      if (ws !== connectingSocket) return;
      send({ type: "hello", role: "viewer", password, clientId });
      startConnectionWatchdog();
      setStatus("已連上訊號伺服器，正在驗證觀看密碼…");
    };

    ws.onmessage = async event => {
      try {
        const message = JSON.parse(event.data);

        if (message.type === "authenticated") {
          authenticated = true;
          $("disconnect").disabled = false;
          setStatus("密碼正確，等待攝影機…（最多 4 位觀看者）");
          return;
        }
        if (message.type === "pong") {
          lastPongAt = Date.now();
          return;
        }
        if (message.type === "viewer-count") {
          $("viewerCount").textContent = (message.count || 0) + " / " + (message.maxViewers || MAX_VIEWERS);
          return;
        }
        if (message.type === "peer-ready") {
          if (message.role === "camera" && message.peerId) {
            cameraId = message.peerId;
            cameraSeenAt = Date.now();
            setStatus("攝影機已連線，等待影音資料…");
          }
          return;
        }
        if (message.type === "error") {
          fail(message.message || "連線驗證失敗");
          cleanup();
          return;
        }
        if (message.type === "offer") {
          if (!pc) return;
          cameraId = message.from || cameraId;
          if (!cameraId) throw new Error("沒有收到攝影機識別資訊");
          await pc.setRemoteDescription(message.sdp);
          remoteDescriptionReady = true;

          for (const candidate of pendingCandidates) {
            try { await pc.addIceCandidate(candidate); }
            catch (error) { console.warn("ICE candidate rejected", error); }
          }
          pendingCandidates = [];

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendToCamera({ type: "answer", sdp: pc.localDescription });
          setStatus("已回覆攝影機，正在建立影音連線…");
          return;
        }
        if (message.type === "candidate" && message.candidate) {
          if (!pc) return;
          if (message.from) cameraId = message.from;
          if (remoteDescriptionReady) {
            try { await pc.addIceCandidate(message.candidate); }
            catch (error) { console.warn("ICE candidate rejected", error); }
          } else {
            pendingCandidates.push(message.candidate);
          }
          return;
        }
        if (message.type === "peer-left") {
          setStatus("攝影機已離線");
          $("media").textContent = "攝影機離線";
          return;
        }
        if (message.type === "hangup") {
          cleanup();
          setStatus("攝影機已結束直播");
        }
      } catch (error) {
        console.error("PocketCam signaling error", error);
        fail("處理連線訊號失敗：" + (error.message || error));
      }
    };

    ws.onerror = () => {
      fail("無法連接訊號伺服器，請稍後再試。");
    };

    ws.onclose = () => {
      clearTimeout(signalTimeout);
      if (ws === connectingSocket) {
        ws = null;
        stopHeartbeat();
        if (pc) {
          pc.close();
          pc = null;
        }
        stopStatsMonitor();
        if (authenticated) setStatus("訊號連線已關閉");
        authenticated = false;
        $("connect").disabled = false;
        $("disconnect").disabled = true;
      }
    };
  } catch (error) {
    console.error("PocketCam connect error", error);
    fail("連線失敗：" + (error.message || error));
    cleanup();
  }
}

$("connect").addEventListener("click", connect);
$("disconnect").addEventListener("click", () => cleanup());
$("fullscreen").addEventListener("click", () => {
  const video = $("video");
  if (video.requestFullscreen) video.requestFullscreen();
});
window.addEventListener("beforeunload", () => cleanup(false));
</script></body></html>
